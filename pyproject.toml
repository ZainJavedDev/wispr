[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wispr-gemini"
version = "0.1.0"
description = "System-wide Gemini Live voice dictation for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "websockets>=14,<17",
]

[project.scripts]
wispr = "wispr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

